name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to publish
        required: true
        default: 0.6.0
        type: string

concurrency:
  group: valhalla-mobile-release
  cancel-in-progress: false

env:
  ANDROID_NDK_VERSION: 29.0.14206865
  VCPKG_VERSION: 2025.12.12

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Validate release input and repository boundary
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $RELEASE_VERSION"
            exit 1
          fi
          if git rev-parse "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Version already exists: $RELEASE_VERSION"
            exit 1
          fi
          ./scripts/check_genericity.sh

  build-ios:
    needs: validate
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64-ios, arm64-ios-simulator, x64-ios-simulator]
    permissions:
      contents: read
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26.5

      - name: Install pinned vcpkg
        run: |
          git clone --depth 1 --branch "$VCPKG_VERSION" https://github.com/microsoft/vcpkg
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Build native Apple library
        run: ./build.sh --ios "${{ matrix.architecture }}"

      - name: Upload Apple slice
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.architecture }}
          path: build/apple/${{ matrix.architecture }}/install
          if-no-files-found: error
          retention-days: 2

      - name: Build third-party license bundle
        if: matrix.architecture == 'arm64-ios'
        run: |
          ./scripts/create_license_bundle.sh \
            build/licenses \
            build/apple/arm64-ios/vcpkg_installed
          ditto -c -k --keepParent build/licenses THIRD_PARTY_LICENSES.zip

      - name: Upload third-party licenses
        if: matrix.architecture == 'arm64-ios'
        uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.zip
          if-no-files-found: error
          retention-days: 2

  package-ios:
    needs: build-ios
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Download device slice
        uses: actions/download-artifact@v4
        with:
          name: ios-arm64-ios
          path: build/apple/arm64-ios/install

      - name: Download arm64 simulator slice
        uses: actions/download-artifact@v4
        with:
          name: ios-arm64-ios-simulator
          path: build/apple/arm64-ios-simulator/install

      - name: Download x64 simulator slice
        uses: actions/download-artifact@v4
        with:
          name: ios-x64-ios-simulator
          path: build/apple/x64-ios-simulator/install

      - name: Create XCFramework
        run: |
          ./scripts/create_xcframework.sh
          ditto -c -k --sequesterRsrc --keepParent \
            build/apple/valhalla-wrapper.xcframework \
            valhalla-wrapper.xcframework.zip
          swift package compute-checksum valhalla-wrapper.xcframework.zip

      - name: Upload XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: apple-release
          path: valhalla-wrapper.xcframework.zip
          if-no-files-found: error
          retention-days: 2

  build-android:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64-v8a, armeabi-v7a, x86, x86_64]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pinned vcpkg
        run: |
          git clone --depth 1 --branch "$VCPKG_VERSION" https://github.com/microsoft/vcpkg
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          add-to-path: false

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Build native Android library
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./build.sh --android "${{ matrix.architecture }}"

      - name: Upload Android native library
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.architecture }}
          path: android/valhalla/src/main/jniLibs/${{ matrix.architecture }}/libvalhalla-wrapper.so
          if-no-files-found: error
          retention-days: 2

  package-android:
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Download arm64 library
        uses: actions/download-artifact@v4
        with:
          name: android-arm64-v8a
          path: android/valhalla/src/main/jniLibs/arm64-v8a

      - name: Download armv7 library
        uses: actions/download-artifact@v4
        with:
          name: android-armeabi-v7a
          path: android/valhalla/src/main/jniLibs/armeabi-v7a

      - name: Download x86 library
        uses: actions/download-artifact@v4
        with:
          name: android-x86
          path: android/valhalla/src/main/jniLibs/x86

      - name: Download x86_64 library
        uses: actions/download-artifact@v4
        with:
          name: android-x86_64
          path: android/valhalla/src/main/jniLibs/x86_64

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Assemble release AAR
        working-directory: android
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          printf '%s\n' "$RELEASE_VERSION" > ../version.txt
          ./gradlew :valhalla:assembleRelease ktfmtCheck test --no-daemon
          cp valhalla/build/outputs/aar/valhalla-release.aar \
            "../valhalla-mobile-${RELEASE_VERSION}.aar"

      - name: Verify packaged ABIs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          archive="valhalla-mobile-${RELEASE_VERSION}.aar"
          for architecture in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -Z1 "$archive" | grep -Fx \
              "jni/${architecture}/libvalhalla-wrapper.so"
          done
          shasum -a 256 "$archive"

      - name: Upload Android release
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: valhalla-mobile-${{ inputs.version }}.aar
          if-no-files-found: error
          retention-days: 2

  publish:
    needs: [package-ios, package-android, build-ios]
    runs-on: macos-26
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Download Apple release
        uses: actions/download-artifact@v4
        with:
          name: apple-release
          path: release-assets

      - name: Download Android release
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-assets

      - name: Download third-party licenses
        uses: actions/download-artifact@v4
        with:
          name: third-party-licenses
          path: release-assets

      - name: Prepare immutable release manifest
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ./scripts/write_xcframework_spm.sh \
            "$RELEASE_VERSION" \
            release-assets/valhalla-wrapper.xcframework.zip
          ./scripts/check_genericity.sh
          git diff --check

      - name: Commit and tag release manifest
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Package.swift version.txt
          git commit -m "Release ${RELEASE_VERSION}"
          git tag -a "$RELEASE_VERSION" -m "Valhalla Mobile ${RELEASE_VERSION}"
          git push origin HEAD:main
          git push origin "$RELEASE_VERSION"

      - name: Attest Apple artifact
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release-assets/valhalla-wrapper.xcframework.zip

      - name: Attest Android artifact
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release-assets/valhalla-mobile-${{ inputs.version }}.aar

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "$RELEASE_VERSION" \
            release-assets/valhalla-wrapper.xcframework.zip \
            "release-assets/valhalla-mobile-${RELEASE_VERSION}.aar" \
            release-assets/THIRD_PARTY_LICENSES.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Valhalla Mobile ${RELEASE_VERSION}" \
            --generate-notes \
            --verify-tag
